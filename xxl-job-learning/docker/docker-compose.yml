version: '3.8'

services:
  xxl-job-mysql:
    image: mysql:8.0
    container_name: xxl-job-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: xxl_job
    ports:
      - "3306:3306"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - xxl-job-mysql-data:/var/lib/mysql
    networks:
      - xxl-job-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: xxl-job-admin
    depends_on:
      xxl-job-mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=root123 --xxl.job.accessToken=default_token"
    networks:
      - xxl-job-network
    restart: always

  xxl-job-executor-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.executor
    container_name: xxl-job-executor-1
    depends_on:
      - xxl-job-admin
    environment:
      XXL_JOB_ADMIN_ADDRESS: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_APPNAME: xxl-job-learning-executor
      XXL_JOB_EXECUTOR_PORT: 9999
      XXL_JOB_ACCESS_TOKEN: default_token
      EXECUTOR_SHARD_INDEX: 0
    networks:
      - xxl-job-network
    restart: always

  xxl-job-executor-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.executor
    container_name: xxl-job-executor-2
    depends_on:
      - xxl-job-admin
    environment:
      XXL_JOB_ADMIN_ADDRESS: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_APPNAME: xxl-job-learning-executor
      XXL_JOB_EXECUTOR_PORT: 9999
      XXL_JOB_ACCESS_TOKEN: default_token
      EXECUTOR_SHARD_INDEX: 1
    networks:
      - xxl-job-network
    restart: always

volumes:
  xxl-job-mysql-data:

networks:
  xxl-job-network:
    driver: bridge
