server:
  port: 8081

# XXL-Job 配置
xxl:
  job:
    # 调度中心地址，多个用逗号分隔
    admin:
      addresses: http://127.0.0.1:8080/xxl-job-admin
    # 执行器通讯token，需要和调度中心配置一致
    accessToken: default_token
    # 执行器配置
    executor:
      # 执行器AppName，需要和调度中心新增执行器时填写的AppName一致
      appname: xxl-job-learning-executor
      # 执行器IP，为空时自动获取
      ip:
      # 执行器端口
      port: 9999
      # 执行器日志路径
      logpath: /data/applogs/xxl-job/jobhandler
      # 执行器日志保留天数
      logretentiondays: 30

# 日志配置
logging:
  level:
    com.example.xxljoblearning: DEBUG
    com.xxl.job: DEBUG
